usb_camera:
  ros__parameters:
    device: /dev/v4l/by-id/usb-046d_0825_F4C52390-video-index0
    width: 640
    height: 480
    fps: 30.0
    frame: camera_optical_frame
    calibration: ''
game_controller:
  ros__parameters:
    device_id: 0
    deadzone: 0.0
    autorepeat_rate: 50.0
    sticky_buttons: false
    coalesce_interval_ms: 1
ball_detector:
  ros__parameters:
    hsv_lower: [174, 70, 60]
    hsv_upper: [12, 255, 255]
    min_area: 80.0
    min_circularity: 0.70
    min_solidity: 0.75
    debug: true
ball_localizer:
  ros__parameters:
    base_frame: base_link
    ball_radius: 0.030
    ball_center_z: 0.045
    max_stamp_skew: 0.10
    scan_stamp_is_end: true
    cluster_gap: 0.035
    max_missing_bins: 2
    min_points: 4
    fit_error: 0.009
    angular_gate: 0.07
    size_ratio_limit: 1.6
    max_range: 2.0
approach_controller:
  ros__parameters:
    rate: 20.0
    target_distance: 0.350
    distance_tolerance: 0.010
    lateral_tolerance: 0.010
    hold_time: 0.5
    max_vx: 0.15
    max_vy: 0.10
    kp_x: 1.0
    kp_y: 1.0
    sensor_timeout: 0.30
    joy_timeout: 0.15
    approach_timeout: 12.0
    detection_timeout: 1.0
    align_gate: 0.04
    axis_x: 1
    axis_y: 0
    axis_yaw: 2
    deadman_button: 9
    start_button: 3
    cancel_button: 1
    deadzone: 0.12
    override_threshold: 0.20
    manual_linear: 0.15
    manual_angular: 0.50
    half_length: 0.15
    half_width: 0.15
    obstacle_margin: 0.025
    validated_min_range: 0.0
    auto_enabled: false
    base_frame: base_link
