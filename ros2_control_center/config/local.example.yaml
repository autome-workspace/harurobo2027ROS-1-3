# この例を ~/.config/ros2-control-center/local.yaml にコピーし、
# 接続した機器に対応する固定名を指定してください。
variables:
  LIDAR_PORT: ''
  IMU_PORT: ''
  CAMERA_PORT: ''
  ENCODER_CAN_INTERFACE: slcan0
  ENCODER_CAN_PORT: ''  # AMT側SLCAN機器の/dev/serial/by-id/固定名
  MOTOR_AUTO_APPROACH: false  # 手動のみで開始。自動接近はGUIで明示的にON
