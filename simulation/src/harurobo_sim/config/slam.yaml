slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    max_laser_range: 12.0
    resolution: 0.05
    map_update_interval: 1.0
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.12
    transform_publish_period: 0.02
    use_map_saver: true
